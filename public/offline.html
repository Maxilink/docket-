<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E0562">
  <title>Offline · C-Diary</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F6FA; color: #1F0F45;
           font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 380px; text-align: center; background: #fff; border: 1px solid #E6E3EE; border-radius: 16px; padding: 28px 24px; }
    img { width: 40px; height: auto; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    p { color: #625C75; margin: 0 0 18px; }
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #2E0562; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/c-diary-mark.png" alt="">
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Today, Calendar and Matters open offline once you've visited them with a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
